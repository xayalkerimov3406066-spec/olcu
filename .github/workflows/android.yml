name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'digital-olcu/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r digital-olcu/index.html digital-olcu/icons android/app/src/main/assets/www/
          sed -i "/serviceWorker/d" android/app/src/main/assets/www/index.html
      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          { grep -A25 "What went wrong" android/build.log; grep -m15 -E "Caused by|error:" android/build.log; } | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk digital-olcu.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Digital ölçü — Android v1.${{ github.run_number }}
          body: Telefona yükləyin və quraşdırın. Fayl açılanda "Naməlum mənbələrdən quraşdırmaya icazə ver" seçin.
          files: digital-olcu.apk
          make_latest: true
